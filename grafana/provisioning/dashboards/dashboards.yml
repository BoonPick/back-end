# Grafana 자동 대시보드 로더 — 아래 경로의 *.json 을 부팅 시/주기적으로 등록.
apiVersion: 1
providers:
  - name: boonpick
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
