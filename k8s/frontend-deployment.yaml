apiVersion: apps/v1
kind: Deployment
metadata:
  name: boonpick-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boonpick-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: boonpick-frontend
    spec:
      containers:
      - name: boonpick-frontend
        image: jaeyoungkimdockerhub/boonpick-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: VITE_API_BASE_URL
          value: "http://boonpick-backend-svc:8000"  # K8s 내부 서비스 디스커버리
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
