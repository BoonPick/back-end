services:
  prometheus:
    image: prom/prometheus:latest
    container_name: boonpick-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    extra_hosts:
      # 컨테이너 안에서 호스트의 FastAPI에 접근하기 위해 필요(리눅스 Docker Engine 환경 대응).
      # Docker Desktop(맥/윈도우)에서는 자동으로 해석되지만, 명시해 두면 리눅스에서도 동작합니다.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: boonpick-grafana
    ports:
      - "3001:3000"   # 호스트 3000번은 다른 곳에서 쓸 수 있어 3001로 매핑. http://localhost:3001 로 접속.
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin   # 최초 로그인 후 변경 권장
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: boonpick-node-exporter
    ports:
      - "9100:9100"
    # 맥(Docker Desktop)에서는 호스트 경로 마운트 효과가 제한적이지만, 리눅스 환경 호환을 위해 표준 옵션 유지.
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  # MySQL 메트릭 수집기. FastAPI 가 쓰는 MySQL 에 붙어 커넥션 수/쿼리/스레드 등을 노출한다.
  # 부하테스트의 핵심 병목(커넥션 풀 부재)을 Grafana 에서 직접 보기 위함.
  #   필요: MySQL 에 모니터링 전용 계정 생성 (jmeter/ci 또는 README 의 SQL 참고)
  #   접속정보는 .env 로 주입 (기본값은 호스트의 MySQL:3306).
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: boonpick-mysqld-exporter
    command:
      - "--mysqld.address=${DB_HOST:-host.docker.internal}:${DB_PORT:-3306}"
      - "--mysqld.username=${DB_EXPORTER_USER:-exporter}"
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${DB_EXPORTER_PASSWORD:-exporter}
    ports:
      - "9104:9104"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 부하 생성기(Apache JMeter). 상시 떠 있는 서비스가 아니라 "1회 실행 후 종료"되는 작업이므로
  # profiles 로 분리해 `docker compose up -d` 시에는 뜨지 않게 한다.
  # 플랜/타깃/부하량을 모두 환경변수로 주입 — 로컬 스모크부터 팀 서버 부하/스트레스까지 한 서비스로 커버.
  #   스모크(로컬):  docker compose --profile loadtest run --rm jmeter
  #   부하(팀서버):  run-load.ps1 / run-stress.ps1 드라이버 사용 (권장)
  # jmeter/ 전체를 /plans 로 마운트하므로 모든 .jmx 와 ids.csv 를 재빌드 없이 사용한다.
  jmeter:
    build: ./jmeter
    image: boonpick-jmeter
    container_name: boonpick-jmeter
    profiles: ["loadtest"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./jmeter:/plans:ro
      - ./jmeter/results:/results
    command:
      - "-n"
      - "-t"
      - "/plans/${LT_PLAN:-board_smoke.jmx}"
      - "-Jhost=${LT_HOST:-host.docker.internal}"
      - "-Jport=${LT_PORT:-8000}"
      - "-Jthreads=${LT_THREADS:-10}"
      - "-Jrampup=${LT_RAMPUP:-5}"
      - "-Jduration=${LT_DURATION:-30}"
      - "-Jthinktime=${LT_THINKTIME:-200}"
      - "-Jpath=${LT_PATH:-/api/board}"
      - "-l"
      - "/results/${LT_OUT:-result}.jtl"
      - "-j"
      - "/results/${LT_OUT:-result}.log"
      - "-e"
      - "-o"
      - "/results/${LT_OUT:-result}-report"

volumes:
  grafana-data:
